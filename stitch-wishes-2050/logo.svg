<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Stitch Wishess">
  <defs>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd4e6"/>
      <stop offset="30%" stop-color="#9cc2e6"/>
      <stop offset="58%" stop-color="#e4cce4"/>
      <stop offset="78%" stop-color="#f0c0e4"/>
      <stop offset="100%" stop-color="#aee2d2"/>
